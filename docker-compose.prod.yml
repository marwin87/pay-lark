services:
  backend:
    image: ghcr.io/marwin87/paylark-backend:${PAYLARK_VERSION:-latest}
    container_name: backend
    restart: unless-stopped
    env_file: .env
    environment:
      # Beats DATABASE_URL from .env (the local-dev value)
      DATABASE_URL: sqlite:////data/paylark.db
    volumes:
      - app_data:/data  # SQLite file (DATABASE_URL in backend/Dockerfile)
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/health')\""]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    ports:
      - "8010:8000"

  frontend:
    image: ghcr.io/marwin87/paylark-frontend:${PAYLARK_VERSION:-latest}
    container_name: frontend
    restart: unless-stopped
    env_file: .env
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "node -e \"require('http').get('http://localhost:3000', r => process.exit(r.statusCode < 500 ? 0 : 1)).on('error', () => process.exit(1))\""]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 30s
    ports:
      - "3010:3000"

  demo-data:
    image: ghcr.io/marwin87/paylark-demo:${PAYLARK_VERSION:-latest}
    container_name: demo-data
    profiles: ["demo"]
    depends_on:
      backend:
        condition: service_healthy
    restart: "no"
    environment:
      SEED_BASE_URL: "http://backend:8000"

volumes:
  app_data:
