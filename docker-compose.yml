services:
  backend:
    image: paylark-backend:latest
    build:
      context: ./backend
      additional_contexts:
        i18n: ./frontend/messages
      args:
        APP_VERSION: ${NEXT_PUBLIC_APP_VERSION:-dev}
    container_name: backend
    restart: unless-stopped
    env_file: .env
    environment:
      # Beats DATABASE_URL from .env (the local-dev value)
      DATABASE_URL: sqlite:////data/paylark.db
      # Passed through explicitly so a shell variable (e.g. set by the e2e run) beats .env.
      RATE_LIMIT_ENABLED: ${RATE_LIMIT_ENABLED:-true}
    volumes:
      - app_data:/data  # SQLite file (DATABASE_URL in backend/Dockerfile)
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/health')\""]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    ports:
      - "8010:8000"

  frontend:
    image: paylark-frontend:latest
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_APP_VERSION: ${NEXT_PUBLIC_APP_VERSION:-dev}
        NEXT_PUBLIC_SESSION_HEARTBEAT_SECONDS: ${NEXT_PUBLIC_SESSION_HEARTBEAT_SECONDS:-180}
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8010}
    container_name: frontend
    restart: unless-stopped
    env_file: .env
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "node -e \"require('http').get('http://localhost:3000', r => process.exit(r.statusCode < 500 ? 0 : 1)).on('error', () => process.exit(1))\""]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 30s
    ports:
      - "3010:3000"

  demo-data:
    build: ./demo
    container_name: demo-data
    depends_on:
      backend:
        condition: service_healthy
    restart: "no"
    environment:
      SEED_BASE_URL: "http://backend:8000"

volumes:
  app_data:
